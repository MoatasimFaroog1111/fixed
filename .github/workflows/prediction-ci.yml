name: Prediction System CI

on:
  push:
    branches:
      - 'agent/multi-horizon-price-forecast'
    paths:
      - 'prediction_system/**'
      - 'prediction_dashboard.py'
      - 'tests/test_prediction_system.py'
      - '.github/workflows/prediction-ci.yml'
  pull_request:
    paths:
      - 'prediction_system/**'
      - 'prediction_dashboard.py'
      - 'tests/test_prediction_system.py'
      - '.github/workflows/prediction-ci.yml'
  workflow_dispatch:

jobs:
  prediction-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install focused dependencies
        run: python -m pip install --upgrade pip && pip install numpy pandas scikit-learn pytest
      - name: Unit tests
        run: pytest -q tests/test_prediction_system.py
      - name: Validate repository datasets and feature pipeline
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from prediction_system.data import PicklePriceRepository
          from prediction_system.features import FeatureBuilder

          ids = ('AUXLN', 'AGXLN', 'PTXLN', 'PDXLN', 'DXY')
          repo = PicklePriceRepository('data')

          def series(frame):
              s = frame['price'].astype(float)
              if not isinstance(s.index, pd.DatetimeIndex):
                  s.index = pd.to_datetime(s.index, errors='coerce')
                  s = s[~s.index.isna()]
              return s.sort_index()[~s.index.duplicated(keep='last')]

          hourly = pd.concat({sid: series(repo.hourly(sid)) for sid in ids}, axis=1, sort=False).sort_index()
          daily = pd.concat({sid: series(repo.daily(sid)) for sid in ids}, axis=1, sort=False).sort_index()

          assert set(ids).issubset(hourly.columns)
          assert set(ids).issubset(daily.columns)

          builder = FeatureBuilder()
          for sid in ids[:4]:
              target = hourly[sid].dropna()
              features = builder.build(target, hourly_context=hourly, daily_context=daily)
              latest = features.iloc[-1].dropna()
              assert float(target.iloc[-1]) > 0
              assert len(latest) >= 50, (sid, len(latest))
              assert np.isfinite(latest).all(), sid
              print(sid, 'rows=', len(target), 'features=', len(latest), 'price=', float(target.iloc[-1]))
          PY
      - name: Validate full multi-horizon forecasts
        run: |
          python - <<'PY'
          import math
          from prediction_system import PredictionService
          from prediction_system.config import HORIZONS, METALS

          result = PredictionService().predict_all()
          assert result['unit'] == 'USD/kg'
          assert len(result['metals']) == len(METALS)
          expected = list(HORIZONS)
          for metal in result['metals']:
              forecasts = metal['forecasts']
              assert [f['horizon'] for f in forecasts] == expected
              for forecast in forecasts:
                  assert forecast.get('status') != 'insufficient_data', (metal['metal'], forecast)
                  assert forecast['current_usd_per_kg'] > 0
                  assert forecast['predicted_usd_per_kg'] > 0
                  assert math.isfinite(forecast['predicted_usd_per_kg'])
                  assert 0.0 <= forecast['confidence'] <= 1.0
              print(metal['metal'], 'OK', len(forecasts), 'horizons')
          PY
