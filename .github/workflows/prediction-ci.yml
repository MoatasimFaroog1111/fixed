name: Prediction System CI

on:
  push:
    branches:
      - 'agent/multi-horizon-price-forecast'
    paths:
      - 'prediction_system/**'
      - 'prediction_dashboard.py'
      - 'train_prediction_models.py'
      - 'tests/test_prediction_system.py'
      - '.github/workflows/prediction-ci.yml'
  pull_request:
    paths:
      - 'prediction_system/**'
      - 'prediction_dashboard.py'
      - 'train_prediction_models.py'
      - 'tests/test_prediction_system.py'
      - '.github/workflows/prediction-ci.yml'
  workflow_dispatch:

jobs:
  prediction-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install focused dependencies
        run: python -m pip install --upgrade pip && pip install numpy pandas scikit-learn pytest requests
      - name: Unit tests
        run: pytest -q tests/test_prediction_system.py
      - name: Validate BullionVault public market source
        run: |
          python - <<'PY'
          from prediction_system.bullionvault import BullionVaultMarketPriceProvider
          provider = BullionVaultMarketPriceProvider(timeout_seconds=20)
          for sid in ('AUXLN', 'AGXLN', 'PTXLN', 'PDXLN'):
              price = provider.usd_per_kg(sid)
              assert price > 0, (sid, price)
              print(sid, 'BullionVault USD/kg midpoint=', round(price, 2))
          PY
      - name: Validate real repository data and production trainer
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from prediction_system.data import PicklePriceRepository
          from prediction_system.features import FeatureBuilder
          from prediction_system.model import WalkForwardEnsembleTrainer

          repo = PicklePriceRepository('data')
          ids = ('AUXLN', 'AGXLN', 'PTXLN', 'PDXLN', 'DXY')

          def series(frame):
              s = frame['price'].astype(float)
              idx = pd.to_datetime(s.index, errors='coerce', utc=True)
              s.index = idx.tz_convert(None)
              return s[~s.index.isna()].sort_index()[~s.index.duplicated(keep='last')]

          hourly = pd.concat({sid: series(repo.hourly(sid)) for sid in ids}, axis=1, sort=False).sort_index()
          daily = pd.concat({sid: series(repo.daily(sid)) for sid in ids}, axis=1, sort=False).sort_index()
          builder = FeatureBuilder()

          for sid in ids[:4]:
              target = hourly[sid].dropna()
              features = builder.build(target, hourly_context=hourly, daily_context=daily)
              latest = features.iloc[-1].dropna()
              assert len(latest) >= 100, (sid, len(latest))
              assert np.isfinite(latest).all(), sid
              print(sid, 'rows=', len(target), 'features=', len(latest), 'price=', float(target.iloc[-1]))

          prices = hourly['AUXLN'].dropna()
          features = builder.build(prices, hourly_context=hourly, daily_context=daily)
          target = np.log(prices.shift(-6) / prices).rename('target')
          sample = features.join(target).dropna().tail(1800)
          artifact = WalkForwardEnsembleTrainer().train('AUXLN', '6h', sample.drop(columns='target'), sample['target'])
          assert len(artifact.models) == 3
          assert abs(sum(artifact.weights) - 1.0) < 1e-9
          assert artifact.training_samples == len(sample)
          print('production trainer smoke OK', artifact.training_samples, len(artifact.feature_names))
          PY
      - name: Validate load-and-predict serving without training
        run: |
          python - <<'PY'
          import time
          import numpy as np
          import pandas as pd
          from sklearn.dummy import DummyRegressor
          from prediction_system.artifacts import PersistedForecastModel, PickleForecastArtifactRepository
          from prediction_system.config import HORIZONS, METALS
          from prediction_system.data import PicklePriceRepository
          from prediction_system.features import FeatureBuilder
          from prediction_system.service import PredictionService

          class FakeLivePriceProvider:
              def usd_per_kg(self, security_id):
                  return {'AUXLN': 130000.0, 'AGXLN': 1800.0, 'PTXLN': 45000.0, 'PDXLN': 39000.0}[security_id]

          price_repo = PicklePriceRepository('data')
          artifact_repo = PickleForecastArtifactRepository('prediction_models_ci')
          ids = tuple(m.security_id for m in METALS) + ('DXY',)

          def series(frame):
              s = frame['price'].astype(float)
              idx = pd.to_datetime(s.index, errors='coerce', utc=True)
              s.index = idx.tz_convert(None)
              return s[~s.index.isna()].sort_index()[~s.index.duplicated(keep='last')]

          hourly = pd.concat({sid: series(price_repo.hourly(sid)) for sid in ids}, axis=1, sort=False).sort_index()
          daily = pd.concat({sid: series(price_repo.daily(sid)) for sid in ids}, axis=1, sort=False).sort_index()
          builder = FeatureBuilder()

          for metal in METALS:
              prices = hourly[metal.security_id].dropna()
              features = builder.build(prices, hourly_context=hourly, daily_context=daily)
              latest = features.iloc[[-1]].dropna(axis=1)
              columns = tuple(latest.columns)
              X = features.loc[:, list(columns)].dropna().tail(500)
              for horizon in HORIZONS:
                  model = DummyRegressor(strategy='constant', constant=0.001).fit(X, np.full(len(X), 0.001))
                  artifact_repo.save(PersistedForecastModel(
                      security_id=metal.security_id,
                      horizon=horizon,
                      feature_names=columns,
                      models=(model,),
                      weights=(1.0,),
                      validation_mae=0.01,
                      confidence=0.8,
                      training_samples=len(X),
                      trained_at='2026-08-15T00:00:00+00:00',
                  ))

          started = time.perf_counter()
          result = PredictionService(
              repository=price_repo,
              artifact_repository=artifact_repo,
              live_price_provider=FakeLivePriceProvider(),
          ).predict_all()
          elapsed = time.perf_counter() - started
          assert result['architecture'] == 'train-once-persist-load-predict'
          assert 'BullionVault' in result['live_data_source']
          assert len(result['metals']) == 4
          assert all(len(m['forecasts']) == 7 for m in result['metals'])
          assert result['metals'][0]['current_usd_per_kg'] == 130000.0
          assert elapsed < 15.0, elapsed
          print('serving OK seconds=', round(elapsed, 3), 'forecasts=', 28)
          PY
