name: Dukascopy Backtest Aggregate

on:
  push:
    branches: [agent/multi-horizon-price-forecast]
    paths:
      - 'tools/aggregate_dukascopy_backtests.py'
      - '.github/workflows/dukascopy-backtest-aggregate.yml'
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all 28 result artifacts from verified run
        uses: actions/download-artifact@v4
        with:
          pattern: dukascopy-backtest-*
          path: backtest_results
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: 31900916980
      - name: Aggregate results
        run: >-
          python tools/aggregate_dukascopy_backtests.py
          --input-dir backtest_results
          --json-out dukascopy_backtest_summary.json
          --csv-out dukascopy_backtest_summary.csv
      - name: Upload aggregate report
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-backtest-summary
          path: |
            dukascopy_backtest_summary.json
            dukascopy_backtest_summary.csv
          if-no-files-found: error
