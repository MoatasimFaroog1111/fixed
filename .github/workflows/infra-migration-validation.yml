name: Infra Migration Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile migration entrypoints
        run: |
          python -m py_compile database.py run_all_bots.py platform_start.py telegram_control_v4_secure.py

      - name: Safety gate - paper mode stays locked
        run: |
          python - <<'PY'
          from pathlib import Path
          files = ["bot_gold.py", "bot_silver.py", "bot_platinum.py", "bot_palladium.py"]
          bad = []
          for name in files:
              text = Path(name).read_text(encoding="utf-8")
              if "DRY_RUN       = True" not in text and "DRY_RUN = True" not in text:
                  bad.append(name)
          if bad:
              raise SystemExit(f"DRY_RUN safety gate failed: {bad}")
          print("DRY_RUN safety gate: PASS")
          PY

      - name: Focused unit tests
        run: |
          pytest -q tests/test_state_manager.py tests/test_risk_manager.py tests/test_parser.py

      - name: Build production container
        run: docker build -t guardian-bullion-bot:migration .
