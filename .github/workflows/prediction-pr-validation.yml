name: Prediction PR Validation

on:
  pull_request:
    paths:
      - 'prediction_system/**'
      - 'prediction_dashboard.py'
      - 'tests/test_prediction_system.py'
      - '.github/workflows/prediction-ci.yml'

jobs:
  prediction-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install focused dependencies
        run: python -m pip install --upgrade pip && pip install numpy pandas scikit-learn pytest
      - name: Unit tests
        run: pytest -q tests/test_prediction_system.py
      - name: Validate real repository datasets and full forecast pipeline
        run: |
          python - <<'PY'
          import math
          from prediction_system import PredictionService
          from prediction_system.config import HORIZONS, METALS

          service = PredictionService()
          result = service.predict_all()
          assert result['unit'] == 'USD/kg'
          assert len(result['metals']) == len(METALS)
          expected = list(HORIZONS)
          for metal in result['metals']:
              forecasts = metal['forecasts']
              assert [f['horizon'] for f in forecasts] == expected
              for f in forecasts:
                  assert f.get('status') != 'insufficient_data', (metal['metal'], f)
                  assert f['current_usd_per_kg'] > 0
                  assert f['predicted_usd_per_kg'] > 0
                  assert math.isfinite(f['predicted_usd_per_kg'])
                  assert 0.0 <= f['confidence'] <= 1.0
              print(metal['metal'], forecasts)
          PY
