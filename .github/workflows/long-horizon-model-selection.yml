name: Long Horizon Model Selection Backtest

on:
  workflow_dispatch:
  push:
    branches: [agent/multi-horizon-price-forecast]
    paths:
      - 'prediction_system/model_selection.py'
      - 'tools/backtest_long_horizon_model_selection.py'
      - '.github/workflows/long-horizon-model-selection.yml'

jobs:
  model-selection:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        metal: [AUXLN, AGXLN, PTXLN, PDXLN]
        horizon: [1w, 1m]
    runs-on: ubuntu-24.04
    name: ${{ matrix.metal }}-${{ matrix.horizon }}-model-selection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scikit-learn requests
      - name: Download verified Dukascopy dataset artifact
        uses: actions/download-artifact@v4
        with:
          name: dukascopy-h1-candidate
          path: dukascopy_h1_candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31881420255
      - name: Run nested purged model selection
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python tools/backtest_long_horizon_model_selection.py
          --candidate-dir dukascopy_h1_candidate
          --metal ${{ matrix.metal }}
          --horizon ${{ matrix.horizon }}
          --folds 3
          --test-size 120
          --out model-selection-${{ matrix.metal }}-${{ matrix.horizon }}.json
      - name: Upload model-selection result
        uses: actions/upload-artifact@v4
        with:
          name: model-selection-${{ matrix.metal }}-${{ matrix.horizon }}
          path: model-selection-${{ matrix.metal }}-${{ matrix.horizon }}.json
          if-no-files-found: error
