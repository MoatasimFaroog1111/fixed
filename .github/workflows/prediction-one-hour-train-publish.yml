name: Prediction One Hour Train And Publish

on:
  workflow_dispatch:
  push:
    branches:
      - agent/multi-horizon-price-forecast
    paths:
      - '.github/workflows/prediction-one-hour-train-publish.yml'

permissions:
  contents: write

env:
  RELEASE_TAG: prediction-models-v1

jobs:
  train-one-hour:
    strategy:
      fail-fast: false
      matrix:
        security_id: [AUXLN, AGXLN, PTXLN, PDXLN]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install training dependencies
        run: python -m pip install --upgrade pip && pip install numpy pandas scikit-learn requests
      - name: Train 1h model
        run: python train_prediction_models.py --security-id '${{ matrix.security_id }}' --horizon '1h'
      - name: Verify 1h model
        run: |
          python - <<'PY'
          import os
          from prediction_system.artifacts import PickleForecastArtifactRepository
          security_id = os.environ['SECURITY_ID']
          artifact = PickleForecastArtifactRepository('prediction_models').load(security_id, '1h')
          assert artifact.security_id == security_id
          assert artifact.horizon == '1h'
          assert len(artifact.models) == 3
          assert artifact.training_samples >= 250
          assert len(artifact.feature_names) >= 100
          print(security_id, '1h verified', artifact.training_samples, artifact.validation_mae, artifact.confidence)
          PY
        env:
          SECURITY_ID: ${{ matrix.security_id }}
      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: one-hour-${{ matrix.security_id }}
          path: prediction_models/${{ matrix.security_id }}/1h.pkl
          if-no-files-found: error
          retention-days: 30

  publish-one-hour:
    needs: train-one-hour
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download 1h artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: one-hour-*
          path: downloaded
      - name: Normalize release names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for metal in AUXLN AGXLN PTXLN PDXLN; do
            src="$(find "downloaded/one-hour-${metal}" -type f -name '1h.pkl' -print -quit)"
            test -n "$src"
            cp "$src" "release-assets/${metal}-1h.pkl"
          done
          test "$(find release-assets -type f -name '*-1h.pkl' | wc -l)" -eq 4
          ls -lh release-assets
      - name: Upload 1h models to existing production release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" release-assets/*-1h.pkl --repo "$GITHUB_REPOSITORY" --clobber
          for metal in AUXLN AGXLN PTXLN PDXLN; do
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[].name' | grep -qx "${metal}-1h.pkl"
          done
          echo 'All four 1h release assets verified.'
